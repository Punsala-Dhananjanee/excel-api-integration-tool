apis:
  - name: "Users"
    url: "https://jsonplaceholder.typicode.com/users"
    method: "GET"
    params: {}
    headers: {}
    sheet_name: "Users"
    columns:
      - { source: "id",           header: "ID" }
      - { source: "name",         header: "Name" }
      - { source: "email",        header: "Email" }
      - { source: "phone",        header: "Phone" }
      - { source: "website",      header: "Website" }
      - { source: "company.name", header: "Company" }

  - name: "Posts"
    url: "https://jsonplaceholder.typicode.com/posts"
    method: "GET"
    params: {}
    headers: {}
    sheet_name: "Posts"
    columns:
      - { source: "id",     header: "ID" }
      - { source: "userId", header: "User ID" }
      - { source: "title",  header: "Title" }
      - { source: "body",   header: "Body" }

excel:
  output_dir: "data/output"
  filename: "api_data.xlsx"
  overwrite: true
  add_summary_sheet: true
  freeze_panes: true
  auto_filter: true

scheduler:
  interval_minutes: 30
  run_immediately: true

logging:
  level: "INFO"
  log_dir: "logs"
  log_to_file: true
